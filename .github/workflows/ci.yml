name: CI

on:
  # The CI runs when a pull request is opened and when the branch lands in
  # main. A push to a branch that has a pull request does not run it again:
  # the run of the pull request already covers that commit.
  pull_request:
  push:
    branches:
      - main

# A new commit in a pull request makes the old run useless. The runs of main
# wait for each other, so every merge gets its release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Require a changelog entry for this version
        run: node scripts/changelog.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Audit the dependencies
        run: pnpm audit --audit-level high

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the system dependencies of the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the frontend
        run: pnpm install --frozen-lockfile
      - name: Build the frontend
        run: pnpm build
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        # The tree still has warnings, so this step reports them without
        # failing the run. It becomes a gate when the tree is clean.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Audit the dependencies
        # The three advisories of the zip crate are about the function that
        # unpacks an archive in one go. The app writes the entries itself with
        # the names confined to the folder, so it never calls it.
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369
