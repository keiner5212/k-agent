[default]
description = "Default permissions for provider and window commands."
permissions = [
  "allow-list",
  "allow-save",
  "allow-delete",
  "allow-refresh",
  "allow-refresh-single",
  "allow-upsert-model",
  "allow-delete-model",
  "allow-set-favorite",
  "allow-set-minimize-to-tray",
  "allow-get-minimize-to-tray",
  "allow-window-minimize",
  "allow-window-toggle-maximize",
  "allow-window-is-maximized",
  "allow-window-close",
  "allow-window-get-bounds",
  "allow-window-apply-bounds",
  "allow-window-start-resize",
  "allow-window-start-drag",
  "allow-window-open-devtools",
  "allow-list-system-fonts",
  "allow-list-skills",
  "allow-read-skill-meta",
  "allow-read-skill-file",
  "allow-create-skill",
  "allow-update-skill",
  "allow-update-skill-content",
  "allow-delete-skill",
  "allow-list-agents",
  "allow-list-agents-md",
  "allow-write-agents-md",
  "allow-delete-agents-md",
  "allow-read-agent-meta",
  "allow-create-agent",
  "allow-update-agent",
  "allow-delete-agent",
  "allow-get-workspace-path",
  "allow-set-workspace-path",
  "allow-list-workspace-files",
  "allow-webview-log",
  "allow-get-repo-info",
  "allow-list-language-servers",
  "allow-install-language-server",
  "allow-uninstall-language-server",
  "allow-resolve-language-server",
  "allow-lsp-request",
  "allow-list-mcp-servers",
  "allow-save-mcp-server",
  "allow-delete-mcp-server",
  "allow-send-chat-message",
  "allow-load-sessions",
  "allow-save-sessions",
  "allow-generate-session-title",
  "allow-run-shell-command",
]

[[permission]]
identifier = "allow-list"
description = "List configured providers."
commands.allow = ["list_providers"]

[[permission]]
identifier = "allow-save"
description = "Create or update a provider."
commands.allow = ["save_provider"]

[[permission]]
identifier = "allow-delete"
description = "Delete a provider."
commands.allow = ["delete_provider"]

[[permission]]
identifier = "allow-refresh"
description = "Refresh the model list for a provider."
commands.allow = ["refresh_provider_models"]

[[permission]]
identifier = "allow-refresh-single"
description = "Refresh a single model's details."
commands.allow = ["refresh_single_model"]

[[permission]]
identifier = "allow-upsert-model"
description = "Create or update a stored model and its capabilities."
commands.allow = ["upsert_provider_model"]

[[permission]]
identifier = "allow-delete-model"
description = "Remove a stored model from a provider."
commands.allow = ["delete_provider_model"]

[[permission]]
identifier = "allow-set-favorite"
description = "Mark or unmark a model as a local favorite."
commands.allow = ["set_model_favorite"]

[[permission]]
identifier = "allow-set-minimize-to-tray"
description = "Set whether closing the window should hide it to the system tray."
commands.allow = ["set_minimize_to_tray"]

[[permission]]
identifier = "allow-get-minimize-to-tray"
description = "Query whether minimize-to-tray is enabled."
commands.allow = ["get_minimize_to_tray"]

[[permission]]
identifier = "allow-window-minimize"
description = "Minimize the main window."
commands.allow = ["window_minimize"]

[[permission]]
identifier = "allow-window-toggle-maximize"
description = "Toggle maximize on the main window."
commands.allow = ["window_toggle_maximize"]

[[permission]]
identifier = "allow-window-is-maximized"
description = "Query whether the main window is maximized."
commands.allow = ["window_is_maximized"]

[[permission]]
identifier = "allow-window-close"
description = "Close the main window."
commands.allow = ["window_close"]

[[permission]]
identifier = "allow-window-get-bounds"
description = "Read the main window size and maximized state."
commands.allow = ["window_get_bounds"]

[[permission]]
identifier = "allow-window-apply-bounds"
description = "Apply a saved size and maximized state to the main window."
commands.allow = ["window_apply_bounds"]

[[permission]]
identifier = "allow-window-start-resize"
description = "Start edge resize dragging on the main window."
commands.allow = ["window_start_resize"]

[[permission]]
identifier = "allow-window-start-drag"
description = "Start moving the main window by dragging the titlebar."
commands.allow = ["window_start_drag"]

[[permission]]
identifier = "allow-window-open-devtools"
description = "Open the webview developer tools."
commands.allow = ["window_open_devtools"]

[[permission]]
identifier = "allow-list-system-fonts"
description = "List font families installed on this system."
commands.allow = ["list_system_fonts"]

[[permission]]
identifier = "allow-set-chat-background-image"
description = "Copy a user-picked image into app data and return its data URL."
commands.allow = ["set_chat_background_image"]

[[permission]]
identifier = "allow-clear-chat-background-image"
description = "Delete the stored chat background image."
commands.allow = ["clear_chat_background_image"]

[[permission]]
identifier = "allow-get-chat-background-data-url"
description = "Return the stored chat background image as a data URL."
commands.allow = ["get_chat_background_data_url"]

[[permission]]
identifier = "allow-list-skills"
description = "List global and workspace skills."
commands.allow = ["list_skills"]

[[permission]]
identifier = "allow-read-skill-meta"
description = "Read a skill's metadata from its SKILL.md frontmatter."
commands.allow = ["read_skill_meta"]

[[permission]]
identifier = "allow-read-skill-file"
description = "Read the raw SKILL.md contents of a skill."
commands.allow = ["read_skill_file"]

[[permission]]
identifier = "allow-create-skill"
description = "Create a new skill folder with a SKILL.md manifest."
commands.allow = ["create_skill"]

[[permission]]
identifier = "allow-update-skill"
description = "Rename a skill folder and rewrite its SKILL.md frontmatter."
commands.allow = ["update_skill"]

[[permission]]
identifier = "allow-update-skill-content"
description = "Overwrite the SKILL.md contents of an existing skill."
commands.allow = ["update_skill_content"]

[[permission]]
identifier = "allow-delete-skill"
description = "Delete a skill folder and its contents."
commands.allow = ["delete_skill"]

[[permission]]
identifier = "allow-list-agents"
description = "List global and workspace agents."
commands.allow = ["list_agents"]

[[permission]]
identifier = "allow-list-agents-md"
description = "Detect and read global and workspace AGENTS.md files."
commands.allow = ["list_agents_md"]

[[permission]]
identifier = "allow-write-agents-md"
description = "Create or overwrite a global or workspace AGENTS.md file."
commands.allow = ["write_agents_md"]

[[permission]]
identifier = "allow-delete-agents-md"
description = "Delete a global or workspace AGENTS.md file."
commands.allow = ["delete_agents_md"]

[[permission]]
identifier = "allow-read-agent-meta"
description = "Read a session agent's metadata from persona.md frontmatter."
commands.allow = ["read_agent_meta"]

[[permission]]
identifier = "allow-create-agent"
description = "Create a new session agent folder with a persona.md manifest."
commands.allow = ["create_agent"]

[[permission]]
identifier = "allow-update-agent"
description = "Rename a session agent folder and rewrite its persona.md."
commands.allow = ["update_agent"]

[[permission]]
identifier = "allow-delete-agent"
description = "Delete an agent folder and its contents."
commands.allow = ["delete_agent"]

[[permission]]
identifier = "allow-get-workspace-path"
description = "Read the current workspace path."
commands.allow = ["get_workspace_path"]

[[permission]]
identifier = "allow-set-workspace-path"
description = "Change the current workspace path for this session."
commands.allow = ["set_workspace_path"]

[[permission]]
identifier = "allow-list-workspace-files"
description = "List files and folders in the current workspace for chat mentions."
commands.allow = ["list_workspace_files"]

[[permission]]
identifier = "allow-webview-log"
description = "Forward webview console output to the Rust process log."
commands.allow = ["webview_log"]

[[permission]]
identifier = "allow-get-repo-info"
description = "Read git metadata for the current workspace."
commands.allow = ["get_repo_info"]

[[permission]]
identifier = "allow-list-language-servers"
description = "List bundled language servers and their install status."
commands.allow = ["list_language_servers"]

[[permission]]
identifier = "allow-install-language-server"
description = "Install a bundled language server into the app config dir."
commands.allow = ["install_language_server"]

[[permission]]
identifier = "allow-uninstall-language-server"
description = "Remove a managed language server from the app config dir."
commands.allow = ["uninstall_language_server"]

[[permission]]
identifier = "allow-resolve-language-server"
description = "Resolve which installed language server handles a file."
commands.allow = ["resolve_language_server"]

[[permission]]
identifier = "allow-lsp-request"
description = "Send a JSON-RPC request to the language server for a file."
commands.allow = ["lsp_request"]

[[permission]]
identifier = "allow-list-mcp-servers"
description = "List configured MCP servers."
commands.allow = ["list_mcp_servers"]

[[permission]]
identifier = "allow-save-mcp-server"
description = "Create or update an MCP server."
commands.allow = ["save_mcp_server"]

[[permission]]
identifier = "allow-delete-mcp-server"
description = "Delete an MCP server."
commands.allow = ["delete_mcp_server"]

[[permission]]
identifier = "allow-refresh-mcp-server-tools"
description = "Refresh MCP server tool list."
commands.allow = ["refresh_mcp_server_tools"]

[[permission]]
identifier = "allow-set-mcp-server-enabled"
description = "Enable or disable an MCP server."
commands.allow = ["set_mcp_server_enabled"]

[[permission]]
identifier = "allow-send-chat-message"
description = "Send a simple chat message to the selected model."
commands.allow = ["send_chat_message"]

[[permission]]
identifier = "allow-load-sessions"
description = "Load persisted chat sessions."
commands.allow = ["load_sessions"]

[[permission]]
identifier = "allow-save-sessions"
description = "Persist chat sessions."
commands.allow = ["save_sessions"]

[[permission]]
identifier = "allow-generate-session-title"
description = "Generate a session title from the first message."
commands.allow = ["generate_session_title"]

[[permission]]
identifier = "allow-run-shell-command"
description = "Run a shell command inside the workspace."
commands.allow = ["run_shell_command"]

[[permission]]
identifier = "allow-cancel-running-task"
description = "Signal the active chat or shell task to stop early."
commands.allow = ["cancel_running_task"]
