[package]
name = "k-agent"
version = "0.0.1"
description = "AI coding model orchestrator"
authors = ["k-agent"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "k_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-store = "2.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
