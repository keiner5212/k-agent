[package]
name = "k-agent"
version = "0.0.1"
description = "AI coding model orchestrator"
authors = ["k-agent"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "k_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "devtools"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-dialog = "2.7.2"
tauri-runtime = "2.11.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "sync", "macros", "process", "io-util", "rt-multi-thread"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
getrandom = "0.2.15"
hkdf = "0.12.4"
sha2 = "0.10.9"
zeroize = "1.8.1"
fontdb = "0.23"
futures-util = "0.3.34"
dunce = "1.0.5"

# Linux tray icon needs GLib + a system-tray indicator; macOS/Windows use native APIs.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18.5"

# Disable deprecated libayatana-appindicator (transitively pulled by tray-icon via libappindicator).
# libayatana-appindicator-glib is the GLib-based replacement and is what's actually needed.
[target.'cfg(target_os = "linux")'.dependencies.libappindicator]
version = "0.9.0"
default-features = false
features = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
